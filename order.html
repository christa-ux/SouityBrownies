<!DOCTYPE html>
<html>
<head>
    <!--Essentials-->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- CSS Files-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <title>Order Brownies | SouityBrownies</title>
</head>
<body>
    <!-- Navbar -->
    <nav id="navbar-container"></nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="text-center mb-4" style="color: #333;">Order Your Brownies</h1>
                
               <form action="https://formsubmit.co/christa.arraj@gmail.com" method="POST" class="p-4 rounded shadow" style="background-color: #F6F1E3; color: #000;">
    <input type="hidden" name="_subject" value="New Brownie Order!">
    <input type="hidden" name="_template" value="table">

    <!-- Personal Info Row -->
    <div class="mb-4">
        <h3 class="mb-3">Your Information</h3>
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="col-md-4">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" required>
            </div>
            <div class="col-md-4">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
        </div>
    </div>

    <!-- Brownie Selection Row -->
   <div class="mb-4">
    <h3 class="mb-3">Brownie Selection (Up to 10 boxes/person)</h3>

    <!-- Row 1: 3 items -->
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="card h-100 border-0" style="background-color: #FFF0F5; border: 2px solid #FABEEB;">
                <div class="card-body">
                    <h6 class="card-title text-black">Regular</h6>
                    <p class="card-text small">$20</p>
                    <div class="input-group">
                        <span class="input-group-text">Qty</span>
                        <input type="number" class="form-control" name="regular_qty" min="0" max="10" value="0" onchange="validateTotal()">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 border-0" style="background-color: #FFF0F5; border: 2px solid #FABEEB;">
                <div class="card-body">
                    <h6 class="card-title text-black">Caramel</h6>
                    <p class="card-text small">$25</p>
                    <div class="input-group">
                        <span class="input-group-text">Qty</span>
                        <input type="number" class="form-control" name="caramel_qty" min="0" max="10" value="0" onchange="validateTotal()">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 border-0" style="background-color: #FFF0F5; border: 2px solid #FABEEB;">
                <div class="card-body">
                    <h6 class="card-title text-black">M&M's</h6>
                    <p class="card-text small">$25</p>
                    <div class="input-group">
                        <span class="input-group-text">Qty</span>
                        <input type="number" class="form-control" name="mms_qty" min="0" max="10" value="0" onchange="validateTotal()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Row 2: 2 items -->
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card h-100 border-0" style="background-color: #FFF0F5; border: 2px solid #FABEEB;">
                <div class="card-body">
                    <h6 class="card-title text-black">Reese's</h6>
                    <p class="card-text small">$25</p>
                    <div class="input-group">
                        <span class="input-group-text">Qty</span>
                        <input type="number" class="form-control" name="reeses_qty" min="0" max="10" value="0" onchange="validateTotal()">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 border-0" style="background-color: #FFF0F5; border: 2px solid #FABEEB;">
                <div class="card-body">
                    <h6 class="card-title text-black">Walnuts</h6>
                    <p class="card-text small">$30</p>
                    <div class="input-group">
                        <span class="input-group-text">Qty</span>
                        <input type="number" class="form-control" name="walnuts_qty" min="0" max="10" value="0" onchange="validateTotal()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="quantityError" class="text-danger mt-2" style="display: none;">
        Maximum 10 boxes total per order!
    </div>
</div>

    <!-- Pickup Row -->
    <div class="mb-4">
        <h3 class="mb-3">Pickup Location</h3>
        <div class="row">
            <div class="col-md-6">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="pickup_location" id="jeanTalon" value="Jean-Talon" required>
                    <label class="form-check-label" for="jeanTalon">Jean-Talon Metro</label>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="pickup_location" id="snowdon" value="Snowdon" required>
                    <label class="form-check-label" for="snowdon">Snowdon Metro</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Instructions Row -->
    <div class="mb-4">
        <div class="row">
            <div class="col">
                <label for="instructions" class="form-label">Special Instructions</label>
                <textarea class="form-control" id="instructions" name="instructions" rows="2"></textarea>
            </div>
        </div>
    </div>

    <!-- Submit Row -->
    <div class="d-grid">
        <button type="submit" class="btn" style="background-color: #FABEEB; color: #000;">Place Order</button>
    </div>
</form>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-3" style="background-color: black; color: white;">
        &copy; 2025 Souity Brownies
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Load navbar -->
    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
            })
            .catch(err => console.error('Failed to load navbar:', err));

        // Validate total quantity doesn't exceed 10
        function validateTotal() {
            const quantities = [
                parseInt(document.querySelector('[name="regular_qty"]').value) || 0,
                parseInt(document.querySelector('[name="caramel_qty"]').value) || 0,
                parseInt(document.querySelector('[name="mms_qty"]').value) || 0,
                parseInt(document.querySelector('[name="reeses_qty"]').value) || 0,
                parseInt(document.querySelector('[name="walnuts_qty"]').value) || 0
            ];
            
            const total = quantities.reduce((sum, qty) => sum + qty, 0);
            const errorElement = document.getElementById('quantityError');
            
            if (total > 10) {
                errorElement.style.display = 'block';
                document.querySelector('button[type="submit"]').disabled = true;
            } else {
                errorElement.style.display = 'none';
                document.querySelector('button[type="submit"]').disabled = false;
            }
        }
    </script>
</body>
</html>
